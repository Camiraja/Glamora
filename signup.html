  <head>

    <link rel="stylesheet" href="css/auth.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@100..900&amp;display=swap"
      rel="stylesheet"
    />
  </head>

  <body
    class="bg-background font-body-md text-on-surface dark:bg-charcoal dark:text-parchment-white transition-colors duration-300"
  >
    <main
      class="relative flex min-h-screen flex-col items-center justify-center p-margin-mobile"
    >
      <div
        class="flex flex-col w-full h-full min-h-[calc(100vh-var(--spacing-margin-mobile)*2)] md:min-h-[calc(100vh-var(--spacing-margin-desktop)*2)] relative overflow-hidden bg-background dark:bg-charcoal rounded-2xl shadow-sm border border-soft-border dark:border-outline-variant transition-colors duration-300 md:flex-row"
      >
        <!-- Left Column: Branding / Visual (Hidden on smaller screens, prominent on desktop) -->
        <div
          class="hidden md:flex flex-col justify-between w-full md:w-1/2 p-xl relative overflow-hidden bg-surface-container-highest dark:bg-primary-container transition-colors duration-300"
        >
          <!-- Decorative Background Element -->
          <div class="absolute inset-0 z-0">
            <div
              class="w-full h-full bg-cover bg-center mix-blend-multiply opacity-80 dark:mix-blend-overlay dark:opacity-40"
              data-alt="A macro, editorial photograph of abstract, smooth, architectural forms."
              style="
                background-image: url(&quot;https://lh3.googleusercontent.com/aida-public/AB6AXuC06YAg7_qWgSTd45WoUdxTqDVKHvNIWPPRxSftg91CWUAiIN531rX5DTXFk6VxP_u69QHbwJxAavDY5rdF0I15KTTgWNeiEXoXtPUrhcUZbi9L9bfXaaKJKGUuABUR8aHDmfFSDa5ExPSnSmKHbFhK0R8eBa1U75P7lgcr2AxS7fISqiwxxkDyWe8qk69iYx2Q1RxQEoWLcSRpPCgA0yrr8tHH844Mor2rZ5qGhJnhKqBMaKm7rzc-&quot;);
              "
            ></div>
            <!-- Gradient Overlay -->
            <div
              class="absolute inset-0 bg-gradient-to-br from-surface-container-highest/60 to-surface-container-highest/20 dark:from-primary-container/80 dark:to-primary-container/40 mix-blend-overlay"
            ></div>
          </div>
          <div class="relative z-10 flex flex-col h-full justify-between">
            <div>
              <!-- Subtle Branding mark -->
              <svg
                class="text-charcoal dark:text-parchment-white mb-lg transition-colors duration-300"
                fill="none"
                height="40"
                viewBox="0 0 40 40"
                width="40"
                xmlns="http://www.w3.org/2000/svg"
              >
                <rect
                  fill="currentColor"
                  height="30"
                  opacity="0.8"
                  width="10"
                  x="5"
                  y="5"
                ></rect>
                <rect
                  fill="currentColor"
                  height="15"
                  width="15"
                  x="20"
                  y="5"
                ></rect>
                <circle
                  cx="27.5"
                  cy="27.5"
                  fill="var(--color-sage)"
                  r="7.5"
                ></circle>
              </svg>
              <h2
                class="font-headline-xl text-headline-xl text-charcoal dark:text-parchment-white max-w-md transition-colors duration-300"
              >
                Elevate your professional presence.
              </h2>
            </div>
            <div class="space-y-sm">
              <p
                class="font-body-lg text-body-lg text-on-surface-variant dark:text-outline-variant max-w-md transition-colors duration-300"
              >
                Join a curated network of modern professionals and discerning
                clients. Experience efficiency without compromise.
              </p>
              <!-- Decorative progress dots -->
              <div class="flex space-x-2 pt-4">
                <div
                  class="w-8 h-1 bg-charcoal dark:bg-parchment-white rounded-full transition-colors duration-300"
                ></div>
                <div
                  class="w-2 h-1 bg-outline-variant dark:bg-surface-tint rounded-full transition-colors duration-300"
                ></div>
                <div
                  class="w-2 h-1 bg-outline-variant dark:bg-surface-tint rounded-full transition-colors duration-300"
                ></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Right Column: Form Area -->
        <div
          class="w-full md:w-1/2 flex flex-col justify-center p-margin-mobile md:p-xl bg-surface-container-lowest dark:bg-primary-container transition-colors duration-300"
        >
          <div class="max-w-md w-full mx-auto flex flex-col">
            <div class="mb-lg">
              <h1
                class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-charcoal dark:text-parchment-white mb-xs transition-colors duration-300"
              >
                Create an Account
              </h1>
              <p
                class="font-body-md text-body-md text-on-surface-variant dark:text-outline-variant transition-colors duration-300"
              >
                Enter your details to get started.
              </p>
            </div>

            <!-- Role Selection Toggle -->
            <div class="mb-lg">
              <p
                class="font-label-sm text-label-sm text-on-surface-variant dark:text-outline-variant mb-sm uppercase tracking-wider transition-colors duration-300"
              >
                I am joining as a:
              </p>
              <div
                class="relative flex w-full bg-surface-container dark:bg-surface-container-high p-xs rounded-lg transition-colors duration-300"
                id="role-toggle-container"
              >
                <!-- Active background pill -->
                <div
                  class="absolute inset-y-xs left-xs w-[calc(50%-4px)] bg-surface-container-lowest dark:bg-charcoal rounded-md shadow-sm transition-transform duration-300 ease-in-out border border-soft-border dark:border-outline-variant"
                  id="role-active-bg"
                ></div>
                <button
                  class="relative z-10 flex-1 py-3 text-center rounded-md font-label-md text-label-md text-charcoal dark:text-parchment-white transition-colors duration-200"
                  id="btn-customer"
                  onclick="selectRole('customer')"
                  type="button"
                >
                  Client
                </button>
                <button
                  class="relative z-10 flex-1 py-3 text-center rounded-md font-label-md text-label-md text-on-surface-variant dark:text-outline-variant transition-colors duration-200"
                  id="btn-vendor"
                  onclick="selectRole('vendor')"
                  type="button"
                >
                  Professional
                </button>
              </div>
            </div>

            <form class="flex flex-col gap-y-md">
              <!-- Full Name -->
              <div class="flex flex-col gap-y-xs relative group">
                <label
                  class="font-label-sm text-label-sm text-charcoal dark:text-parchment-white transition-colors"
                  for="fullName"
                  >Full Name</label
                >
                <input
                  class="w-full px-4 py-3 bg-surface-container-lowest dark:bg-surface-container-high border border-soft-border dark:border-outline-variant rounded-lg font-body-md text-body-md text-charcoal dark:text-parchment-white placeholder:text-outline-variant dark:placeholder:text-surface-tint focus:outline-none focus:border-charcoal dark:focus:border-parchment-white focus:ring-1 focus:ring-charcoal dark:focus:ring-parchment-white transition-colors"
                  id="fullName"
                  name="fullName"
                  placeholder="Jane Doe"
                  required=""
                  type="text"
                />
              </div>

              <!-- Email -->
              <div class="flex flex-col gap-y-xs relative group">
                <label
                  class="font-label-sm text-label-sm text-charcoal dark:text-parchment-white transition-colors"
                  for="email"
                  >Email Address</label
                >
                <input
                  class="w-full px-4 py-3 bg-surface-container-lowest dark:bg-surface-container-high border border-soft-border dark:border-outline-variant rounded-lg font-body-md text-body-md text-charcoal dark:text-parchment-white placeholder:text-outline-variant dark:placeholder:text-surface-tint focus:outline-none focus:border-charcoal dark:focus:border-parchment-white focus:ring-1 focus:ring-charcoal dark:focus:ring-parchment-white transition-colors"
                  id="email"
                  name="email"
                  placeholder="jane@example.com"
                  required=""
                  type="email"
                />
              </div>

              <!-- Professional Extra Fields -->
              <div
                id="professional-fields"
                class="hidden flex flex-col gap-y-md"
              >
                <!-- Business Name -->
                <div class="flex flex-col gap-y-xs relative group">
                  <label
                    for="businessName"
                    class="font-label-sm text-label-sm text-charcoal dark:text-parchment-white transition-colors"
                    >Business Name</label
                  >
                  <input
                    type="text"
                    id="businessName"
                    name="businessName"
                    class="w-full px-4 py-3 bg-surface-container-lowest dark:bg-surface-container-high border border-soft-border dark:border-outline-variant rounded-lg font-body-md text-body-md text-charcoal dark:text-parchment-white placeholder:text-outline-variant dark:placeholder:text-surface-tint focus:outline-none focus:border-charcoal dark:focus:border-parchment-white focus:ring-1 focus:ring-charcoal dark:focus:ring-parchment-white transition-colors"
                    placeholder="e.g. Glamour Studio"
                  />
                </div>

                <!-- Service Category -->
                <div class="flex flex-col gap-y-xs relative group">
                  <label
                    for="serviceCategory"
                    class="font-label-sm text-label-sm text-charcoal dark:text-parchment-white transition-colors"
                    >Service Category</label
                  >
                  <div class="relative w-full">
                    <select
                      id="serviceCategory"
                      name="serviceCategory"
                      class="w-full px-4 py-3 bg-surface-container-lowest dark:bg-surface-container-high border border-soft-border dark:border-outline-variant rounded-lg font-body-md text-body-md text-charcoal dark:text-parchment-white focus:outline-none focus:border-charcoal dark:focus:border-parchment-white focus:ring-1 focus:ring-charcoal dark:focus:ring-parchment-white transition-colors appearance-none cursor-pointer"
                    >
                      <option value="" disabled selected>
                        Select a category
                      </option>
                      <option value="hair">Hair Styling & Care</option>
                      <option value="makeup">Makeup Artistry</option>
                      <option value="nails">Nail Care</option>
                      <option value="spa">Spa & Massage</option>
                      <option value="skincare">Skincare & Esthetics</option>
                    </select>
                    <span
                      class="material-symbols-outlined absolute inset-y-0 right-4 flex items-center text-outline-variant dark:text-surface-tint pointer-events-none transition-colors"
                      >expand_more</span
                    >
                  </div>
                </div>
              </div>

              <!-- Password -->
              <div class="flex flex-col gap-y-xs relative group">
                <label
                  class="font-label-sm text-label-sm text-charcoal dark:text-parchment-white transition-colors"
                  for="password"
                  >Password</label
                >
                <div class="relative w-full">
                  <input
                    class="w-full px-4 py-3 bg-surface-container-lowest dark:bg-surface-container-high border border-soft-border dark:border-outline-variant rounded-lg font-body-md text-body-md text-charcoal dark:text-parchment-white placeholder:text-outline-variant dark:placeholder:text-surface-tint focus:outline-none focus:border-charcoal dark:focus:border-parchment-white focus:ring-1 focus:ring-charcoal dark:focus:ring-parchment-white transition-colors pr-10"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    required=""
                    type="password"
                  />
                  <button
                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-outline-variant dark:text-surface-tint hover:text-charcoal dark:hover:text-parchment-white transition-colors focus:outline-none"
                    onclick="
                      togglePasswordVisibility('password', 'eye-icon-pw')
                    "
                    type="button"
                  >
                    <span
                      class="material-symbols-outlined text-[20px]"
                      id="eye-icon-pw"
                      >visibility_off</span
                    >
                  </button>
                </div>
              </div>

              <!-- Confirm Password -->
              <div class="flex flex-col gap-y-xs relative group">
                <label
                  class="font-label-sm text-label-sm text-charcoal dark:text-parchment-white transition-colors"
                  for="confirmPassword"
                  >Confirm Password</label
                >
                <div class="relative w-full">
                  <input
                    class="w-full px-4 py-3 bg-surface-container-lowest dark:bg-surface-container-high border border-soft-border dark:border-outline-variant rounded-lg font-body-md text-body-md text-charcoal dark:text-parchment-white placeholder:text-outline-variant dark:placeholder:text-surface-tint focus:outline-none focus:border-charcoal dark:focus:border-parchment-white focus:ring-1 focus:ring-charcoal dark:focus:ring-parchment-white transition-colors pr-10"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="••••••••"
                    required=""
                    type="password"
                  />
                  <button
                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-outline-variant dark:text-surface-tint hover:text-charcoal dark:hover:text-parchment-white transition-colors focus:outline-none"
                    onclick="
                      togglePasswordVisibility(
                        'confirmPassword',
                        'eye-icon-cpw',
                      )
                    "
                    type="button"
                  >
                    <span
                      class="material-symbols-outlined text-[20px]"
                      id="eye-icon-cpw"
                      >visibility_off</span
                    >
                  </button>
                </div>
              </div>

              <!-- Terms Checkbox -->
              <div class="flex items-start mt-2">
                <div class="flex items-center h-5">
                  <input
                    class="w-4 h-4 appearance-none border border-soft-border dark:border-outline-variant rounded-sm bg-surface-container-lowest dark:bg-surface-container-high checked:bg-charcoal dark:checked:bg-parchment-white checked:border-charcoal dark:checked:border-parchment-white focus:outline-none focus:ring-2 focus:ring-charcoal/20 dark:focus:ring-parchment-white/20 focus:ring-offset-1 dark:focus:ring-offset-charcoal transition-colors cursor-pointer relative after:content-[''] after:absolute after:hidden checked:after:block after:left-[5px] after:top-[1px] after:w-[5px] after:h-[10px] after:border-r-2 after:border-b-2 after:border-white dark:after:border-charcoal after:rotate-45"
                    id="terms"
                    name="terms"
                    required=""
                    type="checkbox"
                  />
                </div>
                <div class="ml-3 text-sm">
                  <label
                    class="font-body-sm text-body-sm text-on-surface-variant dark:text-outline-variant cursor-pointer transition-colors"
                    for="terms"
                  >
                    I agree to the
                    <a
                      class="text-charcoal dark:text-parchment-white underline underline-offset-2 hover:text-sage dark:hover:text-secondary transition-colors"
                      href="#"
                      >Terms and Conditions</a
                    >
                    and
                    <a
                      class="text-charcoal dark:text-parchment-white underline underline-offset-2 hover:text-sage dark:hover:text-secondary transition-colors"
                      href="#"
                      >Privacy Policy</a
                    >.
                  </label>
                </div>
              </div>

              <!-- Submit Button -->
              <button
                class="w-full mt-4 py-4 bg-charcoal dark:bg-parchment-white text-on-primary dark:text-charcoal font-label-md text-label-md rounded-lg hover:bg-primary dark:hover:bg-white transition-colors flex justify-center items-center gap-2 group"
                type="submit"
              >
                <span>Create Account</span>
                <span
                  class="material-symbols-outlined text-[18px] transform group-hover:translate-x-1 transition-transform"
                  >arrow_forward</span
                >
              </button>
            </form>

            <!-- Divider -->
            <div class="relative flex items-center py-6">
              <div
                class="flex-grow border-t border-soft-border dark:border-outline-variant transition-colors"
              ></div>
              <span
                class="flex-shrink-0 mx-4 font-label-sm text-label-sm text-on-surface-variant dark:text-outline-variant uppercase tracking-wider transition-colors"
                >Or sign up with</span
              >
              <div
                class="flex-grow border-t border-soft-border dark:border-outline-variant transition-colors"
              ></div>
            </div>

            <!-- SSO Buttons -->
            <div class="flex gap-4 mb-4">
              <button
                type="button"
                onclick="handleSSO('google')"
                class="flex-1 flex items-center justify-center gap-2 py-3 bg-surface-container-lowest dark:bg-surface-container-high border border-soft-border dark:border-outline-variant rounded-lg hover:bg-surface-container dark:hover:bg-surface-container-highest transition-colors focus:outline-none focus:ring-2 focus:ring-charcoal/20 dark:focus:ring-parchment-white/20"
              >
                <!-- Google SVG -->
                <svg
                  viewBox="0 0 24 24"
                  width="20"
                  height="20"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                    fill="#4285F4"
                  />
                  <path
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                    fill="#34A853"
                  />
                  <path
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                    fill="#FBBC05"
                  />
                  <path
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                    fill="#EA4335"
                  />
                </svg>
                <span
                  class="font-label-md text-label-md text-charcoal dark:text-parchment-white transition-colors"
                  >Google</span
                >
              </button>

              <button
                type="button"
                onclick="handleSSO('apple')"
                class="flex-1 flex items-center justify-center gap-2 py-3 bg-surface-container-lowest dark:bg-surface-container-high border border-soft-border dark:border-outline-variant rounded-lg hover:bg-surface-container dark:hover:bg-surface-container-highest transition-colors focus:outline-none focus:ring-2 focus:ring-charcoal/20 dark:focus:ring-parchment-white/20"
              >
                <!-- Apple SVG -->
                <svg
                  viewBox="0 0 24 24"
                  width="20"
                  height="20"
                  xmlns="http://www.w3.org/2000/svg"
                  class="text-charcoal dark:text-parchment-white transition-colors"
