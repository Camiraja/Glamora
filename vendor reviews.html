<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Vendor Reviews</title>

    <style>
      @layer base {
        html,
        body {
          margin: 0;
          padding: 0;
        }
        body {
          overscroll-behavior: none;
        }
        main > :first-child {
          margin-top: 0 !important;
        }
        main > :last-child {
          margin-bottom: 0 !important;
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-primary-container": "#949393",
              "on-primary-fixed-variant": "#474747",
              "surface-container-highest": "#e3e2df",
              "inverse-on-surface": "#f2f1ee",
              "surface-container": "#efeeeb",
              "on-tertiary-fixed-variant": "#6b392c",
              "surface-container-lowest": "#ffffff",
              primary: "#171818",
              "surface-bright": "#faf9f6",
              surface: "#faf9f6",
              "success-green": "#5A705F",
              "on-primary-fixed": "#1b1c1c",
              "on-surface": "#1b1c1a",
              tertiary: "#310b03",
              "on-secondary-fixed-variant": "#3c4a40",
              "secondary-fixed-dim": "#bacbbd",
              "surface-container-high": "#e9e8e5",
              "primary-container": "#2c2c2c",
              "on-error-container": "#93000a",
              secondary: "#536257",
              "tertiary-container": "#4b1f14",
              "muted-terracotta": "#BC7C6C",
              "surface-variant": "#e3e2df",
              "on-tertiary": "#ffffff",
              "surface-dim": "#dbdad7",
              "on-secondary": "#ffffff",
              "on-surface-variant": "#444748",
              background: "#faf9f6",
              "on-error": "#ffffff",
              "error-container": "#ffdad6",
              "secondary-container": "#d6e7d8",
              "outline-variant": "#c4c7c7",
              "on-secondary-fixed": "#111e16",
              "parchment-white": "#F7F6F3",
              outline: "#747878",
              "on-primary": "#ffffff",
              "surface-container-low": "#f4f3f0",
              "soft-border": "#E2E2DE",
              "primary-fixed": "#e4e2e1",
              "on-background": "#1b1c1a",
              "inverse-primary": "#c8c6c5",
              error: "#ba1a1a",
              "tertiary-fixed-dim": "#feb5a3",
              "inverse-surface": "#2f312f",
              sage: "#8A9A8D",
              "on-tertiary-container": "#c48373",
              "warning-amber": "#C49D6A",
              "secondary-fixed": "#d6e7d8",
              "on-tertiary-fixed": "#360f06",
              charcoal: "#2C2C2C",
              "error-red": "#A64D4D",
              "tertiary-fixed": "#ffdad2",
              "surface-tint": "#5f5e5e",
              "on-secondary-container": "#59685c",
              "primary-fixed-dim": "#c8c6c5",
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
            spacing: {
              lg: "48px",
              "margin-desktop": "64px",
              "margin-mobile": "16px",
              sm: "12px",
              xs: "4px",
              gutter: "24px",
              xl: "80px",
              md: "24px",
              base: "8px",
            },
            fontFamily: {
              "headline-xl-mobile": ["Hanken Grotesk"],
              "headline-lg-mobile": ["Hanken Grotesk"],
              "label-md": ["Hanken Grotesk"],
              "headline-md": ["Hanken Grotesk"],
              "headline-lg": ["Hanken Grotesk"],
              "label-sm": ["Hanken Grotesk"],
              "headline-xl": ["Hanken Grotesk"],
              "body-lg": ["Hanken Grotesk"],
              "body-sm": ["Hanken Grotesk"],
              "body-md": ["Hanken Grotesk"],
            },
            fontSize: {
              "headline-xl-mobile": [
                "36px",
                { lineHeight: "1.1", fontWeight: "600" },
              ],
              "headline-lg-mobile": [
                "28px",
                { lineHeight: "1.2", fontWeight: "600" },
              ],
              "label-md": [
                "14px",
                { lineHeight: "1", letterSpacing: "0.05em", fontWeight: "600" },
              ],
              "headline-md": ["24px", { lineHeight: "1.3", fontWeight: "500" }],
              "headline-lg": [
                "32px",
                {
                  lineHeight: "1.2",
                  letterSpacing: "-0.01em",
                  fontWeight: "600",
                },
              ],
              "label-sm": [
                "12px",
                { lineHeight: "1", letterSpacing: "0.03em", fontWeight: "600" },
              ],
              "headline-xl": [
                "48px",
                {
                  lineHeight: "1.1",
                  letterSpacing: "-0.02em",
                  fontWeight: "600",
                },
              ],
              "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
              "body-sm": ["14px", { lineHeight: "1.5", fontWeight: "400" }],
              "body-md": ["16px", { lineHeight: "1.6", fontWeight: "400" }],
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="bg-background font-body-md text-on-surface">
    <main
      class="relative flex min-h-screen flex-col items-center p-margin-mobile"
    >
      <div class="flex flex-col w-full max-w-6xl">
        <!-- Top Navigation -->
        <div class="flex w-full mb-lg mt-md">
          <button
            id="back-button"
            class="inline-flex items-center gap-xs text-on-surface-variant hover:text-primary transition-colors font-label-md text-label-md group cursor-pointer bg-transparent border-0 p-0"
          >
            <span
              class="material-symbols-outlined transition-transform group-hover:-translate-x-1"
              style="font-size: 18px"
              >arrow_back</span
            >
            Back to Profile
          </button>
        </div>

        <!-- Header Summary Section (Bento style split) -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-gutter mb-xl">
          <!-- Overall Rating Panel -->
          <div
            class="col-span-1 lg:col-span-4 bg-surface-container-lowest shadow-sm rounded-xl p-lg flex flex-col items-center justify-center text-center relative overflow-hidden"
          >
            <div
              class="absolute -top-10 -right-10 w-32 h-32 bg-warning-amber/10 rounded-full blur-2xl"
            ></div>
            <h2
              id="overall-rating"
              class="font-headline-xl text-headline-xl text-primary m-0 tracking-tight"
            >
              4.9
            </h2>
            <div
              aria-label="4.9 out of 5 stars"
              class="flex items-center gap-1 text-warning-amber mt-xs mb-sm"
            >
              <span
                class="material-symbols-outlined"
                style="font-variation-settings: &quot;FILL&quot; 1"
                >star</span
              >
              <span
                class="material-symbols-outlined"
                style="font-variation-settings: &quot;FILL&quot; 1"
                >star</span
              >
              <span
                class="material-symbols-outlined"
                style="font-variation-settings: &quot;FILL&quot; 1"
                >star</span
              >
              <span
                class="material-symbols-outlined"
                style="font-variation-settings: &quot;FILL&quot; 1"
                >star</span
              >
              <span class="material-symbols-outlined">star_half</span>
            </div>
            <p
              id="total-reviews-count"
              class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest"
            >
              128 Reviews
            </p>
          </div>

          <!-- Rating Distribution -->
          <div
            class="col-span-1 lg:col-span-8 bg-surface-container-lowest shadow-sm rounded-xl p-md lg:p-lg flex flex-col justify-center"
          >
            <h3
              class="font-label-sm text-label-sm text-on-surface-variant mb-md uppercase tracking-wider"
            >
              Rating Distribution
            </h3>
            <div class="flex flex-col gap-sm w-full">
              <!-- 5 Star Row -->
              <div class="flex items-center gap-md group">
                <span
                  class="font-label-md text-label-md text-primary w-16 text-right whitespace-nowrap"
                  >5 Stars</span
                >
                <div
                  class="flex-1 h-2 bg-surface-container-high rounded-full overflow-hidden"
                >
                  <div
                    class="h-full bg-charcoal rounded-full transition-all duration-1000 ease-out"
                    style="width: 85%"
                  ></div>
                </div>
                <span
                  class="font-label-sm text-label-sm text-on-surface-variant w-8 text-left"
                  >109</span
                >
              </div>
              <!-- 4 Star Row -->
              <div class="flex items-center gap-md group">
                <span
                  class="font-label-md text-label-md text-primary w-16 text-right whitespace-nowrap"
                  >4 Stars</span
                >
                <div
                  class="flex-1 h-2 bg-surface-container-high rounded-full overflow-hidden"
                >
                  <div
                    class="h-full bg-charcoal rounded-full transition-all duration-1000 ease-out"
                    style="width: 10%"
                  ></div>
                </div>
                <span
                  class="font-label-sm text-label-sm text-on-surface-variant w-8 text-left"
                  >12</span
                >
              </div>
              <!-- 3 Star Row -->
              <div class="flex items-center gap-md group">
                <span
                  class="font-label-md text-label-md text-primary w-16 text-right whitespace-nowrap"
                  >3 Stars</span
                >
                <div
                  class="flex-1 h-2 bg-surface-container-high rounded-full overflow-hidden"
                >
                  <div
                    class="h-full bg-charcoal opacity-60 rounded-full transition-all duration-1000 ease-out"
                    style="width: 3%"
                  ></div>
                </div>
                <span
                  class="font-label-sm text-label-sm text-on-surface-variant w-8 text-left"
                  >4</span
                >
              </div>
              <!-- 2 Star Row -->
              <div class="flex items-center gap-md group">
                <span
                  class="font-label-md text-label-md text-primary w-16 text-right whitespace-nowrap"
                  >2 Stars</span
                >
                <div
                  class="flex-1 h-2 bg-surface-container-high rounded-full overflow-hidden"
                >
                  <div
                    class="h-full bg-muted-terracotta opacity-80 rounded-full transition-all duration-1000 ease-out"
                    style="width: 1%"
                  ></div>
                </div>
                <span
                  class="font-label-sm text-label-sm text-on-surface-variant w-8 text-left"
                  >1</span
                >
              </div>
              <!-- 1 Star Row -->
              <div class="flex items-center gap-md group">
                <span
                  class="font-label-md text-label-md text-primary w-16 text-right whitespace-nowrap"
                  >1 Star</span
                >
                <div
                  class="flex-1 h-2 bg-surface-container-high rounded-full overflow-hidden"
                >
                  <div
                    class="h-full bg-muted-terracotta rounded-full transition-all duration-1000 ease-out"
                    style="width: 1%"
                  ></div>
                </div>
                <span
                  class="font-label-sm text-label-sm text-on-surface-variant w-8 text-left"
                  >2</span
                >
              </div>
            </div>
          </div>
        </div>

        <!-- Filter Controls -->
        <div
          class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-lg"
        >
          <!-- Filter Option 1: Rating Filter Pills -->
          <div
            id="rating-filters"
            class="flex items-center p-1 bg-surface-container-high rounded-full w-max shadow-inner overflow-x-auto hide-scrollbar max-w-full"
          >
            <button
              data-rating="all"
              class="px-6 py-2.5 rounded-full bg-surface-container-lowest shadow-sm font-label-md text-label-md text-primary transition-all flex items-center gap-2 cursor-pointer"
            >
              All Reviews
            </button>
            <button
              data-rating="5"
              class="px-6 py-2.5 rounded-full hover:bg-surface-container/50 font-label-md text-label-md text-on-surface-variant hover:text-primary transition-all flex items-center gap-1 cursor-pointer"
            >
              5 <span class="material-symbols-outlined text-[14px]">star</span>
            </button>
            <button
              data-rating="4"
              class="px-6 py-2.5 rounded-full hover:bg-surface-container/50 font-label-md text-label-md text-on-surface-variant hover:text-primary transition-all flex items-center gap-1 cursor-pointer"
            >
              4 <span class="material-symbols-outlined text-[14px]">star</span>
            </button>
            <button
              data-rating="3"
              class="px-6 py-2.5 rounded-full hover:bg-surface-container/50 font-label-md text-label-md text-on-surface-variant hover:text-primary transition-all flex items-center gap-1 cursor-pointer"
            >
              3 <span class="material-symbols-outlined text-[14px]">star</span>
            </button>
            <button
              data-rating="2"
              class="px-6 py-2.5 rounded-full hover:bg-surface-container/50 font-label-md text-label-md text-on-surface-variant hover:text-primary transition-all flex items-center gap-1 cursor-pointer"
            >
              2 <span class="material-symbols-outlined text-[14px]">star</span>
            </button>
            <button
              data-rating="1"
              class="px-6 py-2.5 rounded-full hover:bg-surface-container/50 font-label-md text-label-md text-on-surface-variant hover:text-primary transition-all flex items-center gap-1 cursor-pointer"
            >
              1 <span class="material-symbols-outlined text-[14px]">star</span>
            </button>
          </div>

          <!-- Filter Option 2: Sort Dropdown Filter -->
          <div
            class="relative items-center gap-2 text-on-surface-variant self-end sm:self-auto"
          >
            <div class="flex items-center gap-2">
              <span class="font-label-sm text-label-sm uppercase"
                >Sort by:</span
              >
              <button
                id="sort-dropdown-btn"
                class="font-label-md text-label-md text-primary flex items-center gap-1 hover:opacity-70 transition-opacity bg-transparent border-0 cursor-pointer"
              >
                <span id="current-sort-label">Most Recent</span>
                <span class="material-symbols-outlined text-[16px]"
                  >expand_more</span
                >
              </button>
            </div>

            <!-- Dropdown Menu -->
            <div
              id="sort-menu"
              class="hidden absolute right-0 mt-2 w-44 bg-surface-container-lowest shadow-lg rounded-xl py-2 z-20 border border-surface-container-high"
            >
              <button
                data-sort="recent"
                class="w-full text-left px-4 py-2 text-body-sm text-primary hover:bg-surface-container transition-colors cursor-pointer font-label-md"
              >
                Most Recent
              </button>
              <button
                data-sort="highest"
                class="w-full text-left px-4 py-2 text-body-sm text-primary hover:bg-surface-container transition-colors cursor-pointer font-label-md"
              >
                Highest Rated
              </button>
              <button
                data-sort="lowest"
                class="w-full text-left px-4 py-2 text-body-sm text-primary hover:bg-surface-container transition-colors cursor-pointer font-label-md"
              >
                Lowest Rated
              </button>
            </div>
          </div>
        </div>

        <!-- Reviews Feed Container -->
        <div id="reviews-feed" class="flex flex-col gap-md">
          <!-- Rendered dynamically via JavaScript -->
        </div>

        <!-- Load More Action -->
        <div
          id="load-more-container"
          class="w-full flex justify-center mt-xl mb-lg"
        >
          <button
            id="load-more-btn"
            class="px-8 py-3 rounded-full bg-primary text-on-primary font-label-md text-label-md hover:opacity-90 transition-opacity shadow-md hover:shadow-lg flex items-center gap-2 cursor-pointer"
          >
            Load More Reviews
            <span class="material-symbols-outlined text-[18px]"
              >arrow_downward</span
            >
          </button>
        </div>
      </div>
    </main>

    <script src="js/vendor-reviews.js"></script>
  </body>
</html>
